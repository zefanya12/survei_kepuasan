<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Kepuasan Layanan — Lapas</title>
  <link href="https://script.google.com/macros/s/AKfycbxnyVG9GyAj-Q6pdI5itNdloev8rSnw0arA84zsKOrRZVVA6k5sFANV93jrZ84sOmH6XA/exec" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0b1f3a;
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --white: #f9f7f2;
      --card-bg: rgba(255,255,255,0.04);
      --border: rgba(201,168,76,0.3);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* === BACKGROUND ATMOSPHERE === */
    .bg-ring {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.08);
      animation: pulse-ring 8s ease-in-out infinite;
      pointer-events: none;
    }
    .bg-ring:nth-child(1) { width: 500px; height: 500px; top: -150px; right: -150px; animation-delay: 0s; }
    .bg-ring:nth-child(2) { width: 700px; height: 700px; bottom: -250px; left: -200px; animation-delay: 2s; }
    .bg-ring:nth-child(3) { width: 300px; height: 300px; top: 40%; left: 30%; animation-delay: 4s; opacity: 0.5; }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    .gold-glow {
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }

    /* === CARD === */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(11,31,58,0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 440px;
      margin: 20px;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.1),
        0 40px 80px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(201,168,76,0.15);
      animation: card-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* === HEADER === */
    .header { text-align: center; margin-bottom: 32px; }

    .logo-wrap {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--gold) 0%, #8b6914 100%);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
      box-shadow: 0 8px 24px rgba(201,168,76,0.35);
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--border);
      padding: 4px 14px;
      border-radius: 100px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 900;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(249,247,242,0.45);
      letter-spacing: 0.3px;
    }

    /* === DIVIDER === */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border));
    }
    .divider::after { background: linear-gradient(to left, transparent, var(--border)); }
    .divider span { font-size: 10px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }

    /* === FORM FIELDS === */
    .field {
      position: relative;
      margin-bottom: 14px;
      animation: field-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .field:nth-child(1) { animation-delay: 0.15s; }
    .field:nth-child(2) { animation-delay: 0.25s; }
    .field:nth-child(3) { animation-delay: 0.35s; }

    @keyframes field-in {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      pointer-events: none;
      opacity: 0.5;
    }

    input {
      width: 100%;
      padding: 13px 16px 13px 40px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 12px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    input::placeholder { color: rgba(249,247,242,0.3); }

    input:focus {
      border-color: var(--gold);
      background: rgba(201,168,76,0.06);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
    }

    /* === RATING === */
    .rating-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(249,247,242,0.4);
      text-align: center;
      margin-bottom: 16px;
    }

    .rating-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .rating-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 16px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex: 1;
    }

    .rating-btn:hover {
      transform: translateY(-6px) scale(1.05);
      border-color: var(--gold);
      background: rgba(201,168,76,0.08);
      box-shadow: 0 12px 28px rgba(201,168,76,0.2);
    }

    .rating-btn:active { transform: scale(0.96); }

    .rating-btn .emoji { font-size: 30px; display: block; line-height: 1; }
    .rating-btn .label {
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(249,247,242,0.5);
      white-space: nowrap;
    }

    .rating-btn.selected {
      border-color: var(--gold);
      background: rgba(201,168,76,0.12);
      box-shadow: 0 0 0 2px rgba(201,168,76,0.25), 0 12px 28px rgba(201,168,76,0.2);
    }

    /* === SUBMIT BUTTON === */
    .btn-submit {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold) 0%, #a87b20 100%);
      border: none;
      border-radius: 14px;
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(201,168,76,0.3);
      display: none;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(201,168,76,0.45);
      filter: brightness(1.05);
    }

    .btn-submit:active { transform: scale(0.98); }
    .btn-submit.visible { display: block; animation: btn-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes btn-in {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* === SOCIAL === */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(201,168,76,0.12);
    }

    .social-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.15);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      font-size: 17px;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      border-color: var(--gold);
      background: rgba(201,168,76,0.1);
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(201,168,76,0.2);
    }

    /* === SUCCESS OVERLAY === */
    .success-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 0;
    }

    .success-overlay.show { display: flex; animation: card-in 0.6s ease both; }

    .checkmark {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--gold) 0%, #8b6914 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(201,168,76,0.4);
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    @keyframes pop {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }

    .success-overlay h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--white);
      margin-bottom: 8px;
    }

    .success-overlay p { font-size: 13px; color: rgba(249,247,242,0.45); margin-bottom: 24px; }

    .btn-reset {
      padding: 11px 28px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: transparent;
      color: var(--gold);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover { background: rgba(201,168,76,0.1); }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(11,31,58,0.3);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Background atmosphere -->
  <div class="bg-ring"></div>
  <div class="bg-ring"></div>
  <div class="bg-ring"></div>
  <div class="gold-glow"></div>

  <div class="card">

    <!-- MAIN FORM -->
    <div id="formView">
      <div class="header">
        <div class="logo-wrap">⚖️</div>
        <div class="badge">Kemenkumham RI</div>
        <h1>Survey Kepuasan<br>Layanan</h1>
        <p class="subtitle">Pendapat Anda sangat berarti bagi kami</p>
      </div>

      <div class="divider"><span>Data Diri</span></div>

      <div class="field">
        <span class="field-icon">👤</span>
        <input id="nama" type="text" placeholder="Nama Lengkap" autocomplete="name">
      </div>
      <div class="field">
        <span class="field-icon">📍</span>
        <input id="alamat" type="text" placeholder="Alamat" autocomplete="street-address">
      </div>
      <div class="field">
        <span class="field-icon">📱</span>
        <input id="nohp" type="tel" placeholder="Nomor HP" autocomplete="tel">
      </div>

      <div class="divider"><span>Penilaian Anda</span></div>

      <p class="rating-label">Bagaimana layanan kami hari ini?</p>
      <div class="rating-row">
        <button class="rating-btn" onclick="pilihRating(this, 'Kurang')">
          <span class="emoji">😞</span>
          <span class="label">Kurang</span>
        </button>
        <button class="rating-btn" onclick="pilihRating(this, 'Baik')">
          <span class="emoji">🙂</span>
          <span class="label">Baik</span>
        </button>
        <button class="rating-btn" onclick="pilihRating(this, 'Sangat Baik')">
          <span class="emoji">😄</span>
          <span class="label">Sangat Baik</span>
        </button>
      </div>

      <button class="btn-submit" id="btnKirim" onclick="kirim()">Kirim Penilaian</button>

      <div class="social-row">
        <a class="social-btn" href="https://instagram.com" target="_blank" title="Instagram">📸</a>
        <a class="social-btn" href="https://tiktok.com" target="_blank" title="TikTok">🎵</a>
        <a class="social-btn" href="https://facebook.com" target="_blank" title="Facebook">📘</a>
        <a class="social-btn" href="https://x.com" target="_blank" title="X (Twitter)">✖️</a>
      </div>
    </div>

    <!-- SUCCESS VIEW -->
    <div class="success-overlay" id="successView">
      <div class="checkmark">✓</div>
      <h2>Terima Kasih!</h2>
      <p>Penilaian Anda telah berhasil dikirim.<br>Kami akan terus meningkatkan layanan.</p>
      <button class="btn-reset" onclick="reset()">Isi Survey Lagi</button>
    </div>

  </div>

  <script>
    let selectedRating = null;

    function pilihRating(btn, nilai) {
      // Remove selected from all buttons
      document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedRating = nilai;

      // Show submit button
      const btnKirim = document.getElementById('btnKirim');
      btnKirim.classList.add('visible');
    }

    function kirim() {
      const nama   = document.getElementById('nama').value.trim();
      const alamat = document.getElementById('alamat').value.trim();
      const nohp   = document.getElementById('nohp').value.trim();

      if (!nama || !alamat || !nohp) {
        // Shake the empty fields
        ['nama','alamat','nohp'].forEach(id => {
          const el = document.getElementById(id);
          if (!el.value.trim()) {
            el.style.borderColor = '#e05555';
            el.style.boxShadow = '0 0 0 3px rgba(224,85,85,0.15)';
            el.addEventListener('input', () => {
              el.style.borderColor = '';
              el.style.boxShadow = '';
            }, { once: true });
          }
        });
        return;
      }

      if (!selectedRating) {
        alert("Pilih penilaian terlebih dahulu.");
        return;
      }

      const btn = document.getElementById('btnKirim');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Mengirim...';

      const data = { nama, alamat, nohp, rating: selectedRating };

      fetch("URL_APPS_SCRIPT", {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(res => res.text())
      .then(() => tampilkanSukses())
      .catch(() => tampilkanSukses()); // show success even on network err for demo
    }

    function tampilkanSukses() {
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').classList.add('show');
    }

    function reset() {
      document.getElementById('formView').style.display = 'block';
      document.getElementById('successView').classList.remove('show');
      document.getElementById('nama').value = '';
      document.getElementById('alamat').value = '';
      document.getElementById('nohp').value = '';
      document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
      selectedRating = null;
      const btn = document.getElementById('btnKirim');
      btn.classList.remove('visible');
      btn.disabled = false;
      btn.innerHTML = 'Kirim Penilaian';
    }
  </script>
</body>
</html>
