<!-- ===================== INDEX (USER PAGE) ===================== -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Kepuasan Lapas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-indigo-700 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
  <!-- Logo -->
  <img src="logo.png" class="w-20 mx-auto mb-4">
  <h2 class="text-xl font-bold mb-4">Survey Kepuasan Layanan</h2>

  <!-- Form -->
  <input id="nama" type="text" placeholder="Nama" class="w-full p-2 mb-3 border rounded-lg">
  <input id="alamat" type="text" placeholder="Alamat" class="w-full p-2 mb-3 border rounded-lg">
  <input id="nohp" type="text" placeholder="No HP" class="w-full p-2 mb-3 border rounded-lg">

  <!-- Emoji Rating -->
  <div class="flex justify-around text-3xl my-4">
    <button onclick="kirim('Kurang')" class="hover:scale-125 transition">😞</button>
    <button onclick="kirim('Baik')" class="hover:scale-125 transition">🙂</button>
    <button onclick="kirim('Sangat Baik')" class="hover:scale-125 transition">😄</button>
  </div>

  <!-- Sosial Media -->
  <div class="flex justify-center gap-4 mt-4">
    <a href="https://instagram.com" target="_blank">📷</a>
    <a href="https://tiktok.com" target="_blank">🎵</a>
    <a href="https://facebook.com" target="_blank">📘</a>
    <a href="https://x.com" target="_blank">❌</a>
  </div>
</div>

<script>
function kirim(rating) {
  const data = {
    nama: document.getElementById('nama').value,
    alamat: document.getElementById('alamat').value,
    nohp: document.getElementById('nohp').value,
    rating: rating
  };

  if (!data.nama || !data.alamat || !data.nohp) {
    alert("Harap isi semua data!");
    return;
  }

  fetch("URL_APPS_SCRIPT", {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(() => {
    alert("Terima kasih 🙏");
    location.reload();
  });
}
</script>

</body>
</html>
