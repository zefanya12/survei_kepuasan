<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="logo.png">
  <title>Survey Kepuasan – Lapas Lirung</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>

  <style>
    :root {

      /* ───── WARNA BARU DARK NAVY ───── */
      --blue:     #00223D;
      --blue2:    #0A345A;
      --blue3:    #3B5F7D;
      --blue-dim: #00172A;

      --bg:       #f3f6fa;
      --bg2:      #e9eef4;
      --surface:  #ffffff;

      --navy:     #001B30;
      --navy2:    #0A2C4A;

      --text:     #1b2b3b;
      --muted:    #6f8093;
      --light:    #b7c4d1;

      --red:      #e05252;
      --green:    #3dbf7c;
      --yellow:   #f0a500;

      --border:   rgba(0,34,61,0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      color: var(--text);
    }

    /* ───── BG BLOBS ───── */

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: blobDrift 18s ease-in-out infinite alternate;
    }

    .blob1 {
      width: 480px;
      height: 480px;
      background: rgba(0,34,61,.12);
      top: -120px;
      left: -140px;
    }

    .blob2 {
      width: 360px;
      height: 360px;
      background: rgba(0,34,61,.08);
      bottom: -80px;
      right: -80px;
      animation-delay: -8s;
    }

    .blob3 {
      width: 240px;
      height: 240px;
      background: rgba(0,34,61,.05);
      top: 40%;
      left: 60%;
      animation-delay: -4s;
    }

    @keyframes blobDrift {
      from {
        transform: translate(0,0) scale(1);
      }
      to {
        transform: translate(24px,18px) scale(1.06);
      }
    }

    /* ───── LAYOUT ───── */

    .page-wrap {
      position: relative;
      z-index: 1;
      width: min(900px, 96vw);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin: 48px auto;
      align-items: start;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: sticky;
      top: 40px;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0,34,61,.3);
      overflow: hidden;
      position: relative;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.18) 0%,
        transparent 60%
      );
    }

    .logo-wrap img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,34,61,.08);
      border: 1px solid rgba(0,34,61,.15);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--blue);
      width: fit-content;
    }

    .chip::before {
      content: '●';
      font-size: .45rem;
    }

    .brand-block h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(1.7rem, 3.5vw, 2.4rem);
      color: var(--navy);
      line-height: 1.15;
    }

    .brand-block h1 em {
      font-style: italic;
      color: var(--blue);
    }

    .brand-block .inst {
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ───── INFO CARD ───── */

    .info-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 24px rgba(0,34,61,.07);
    }

    .info-card-title {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,34,61,.06);
    }

    .info-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(0,34,61,.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-text {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
    }

    .info-sub {
      font-size: .73rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ───── SOCIAL ───── */

    .social-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .social-stack-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .soc-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .soc-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: .75rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      transition: .2s;
      box-shadow: 0 2px 8px rgba(0,34,61,.06);
    }

    .soc-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,34,61,.15);
    }

    .soc-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ───── CARD ───── */

    .card {
      background: var(--surface);
      border-radius: 24px;
      border: 1.5px solid var(--border);
      box-shadow: 0 8px 48px rgba(0,34,61,.1);
      overflow: hidden;
    }

    .card-header {
      background: var(--blue);
      padding: 26px 28px;
      position: relative;
      overflow: hidden;
    }

    .card-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.12) 0%,
        transparent 60%
      );
    }

    .card-header-dots {
      position: absolute;
      right: -30px;
      top: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 40px solid rgba(255,255,255,.05);
    }

    .card-header h2 {
      font-family: 'Instrument Serif', serif;
      color: white;
      font-size: 1.3rem;
      position: relative;
    }

    .card-header p {
      color: rgba(255,255,255,.65);
      font-size: .8rem;
      margin-top: 5px;
      position: relative;
    }

    /* ───── STEP ───── */

    .step-row {
      display: flex;
      gap: 5px;
      margin-bottom: 16px;
      position: relative;
    }

    .step-dot {
      width: 22px;
      height: 5px;
      border-radius: 10px;
      background: rgba(255,255,255,.25);
      transition: .3s;
    }

    .step-dot.active {
      width: 36px;
      background: rgba(255,255,255,.9);
    }

    /* ───── FORM ───── */

    .card-body {
      padding: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .71rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--navy2);
      margin-bottom: 8px;
    }

    .req {
      color: var(--red);
    }

    .opt {
      color: var(--muted);
      font-size: .65rem;
      font-weight: 500;
      background: rgba(0,34,61,.05);
      border: 1px solid rgba(0,34,61,.1);
      border-radius: 20px;
      padding: 2px 8px;
      text-transform: none;
    }

    .input-wrap,
    .textarea-wrap {
      position: relative;
    }

    input,
    textarea {
      width: 100%;
      border: 1.5px solid rgba(0,34,61,.12);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: .2s;
    }

    input {
      padding: 13px 16px 13px 44px;
      font-size: .9rem;
    }

    textarea {
      padding: 13px 16px 13px 44px;
      min-height: 96px;
      resize: vertical;
      font-size: .88rem;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
      background: white;
      box-shadow: 0 0 0 4px rgba(0,34,61,.08);
    }

    .input-icon,
    .textarea-icon {
      position: absolute;
      left: 14px;
      color: var(--blue3);
      pointer-events: none;
    }

    .input-icon {
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
    }

    .textarea-icon {
      top: 15px;
      width: 17px;
      height: 17px;
    }

    /* ───── RATING ───── */

    .rating-label {
      font-size: .71rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--navy2);
      margin-bottom: 12px;
    }

    .emoji-row {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 10px;
    }

    .emoji-btn {
      border: 1.5px solid rgba(0,34,61,.1);
      border-radius: 16px;
      background: var(--bg);
      padding: 16px 8px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: .25s;
    }

    .emoji-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,34,61,.12);
    }

    .emoji-btn .icon {
      font-size: 2.2rem;
    }

    .emoji-btn .caption {
      font-size: .72rem;
      font-weight: 700;
      color: var(--muted);
    }

    .emoji-btn .caption-sub {
      font-size: .62rem;
      color: #aaa;
    }

    .sel-kurang {
      border-color: #e05252 !important;
      background: #fff5f5 !important;
    }

    .sel-baik {
      border-color: var(--yellow) !important;
      background: #fff9ed !important;
    }

    .sel-sangat {
      border-color: var(--green) !important;
      background: #f0fdf6 !important;
    }

    /* ───── DIVIDER ───── */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 18px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(0,34,61,.08);
    }

    .divider-label {
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--light);
    }

    /* ───── CHAR COUNTER ───── */

    .char-counter {
      text-align: right;
      font-size: .67rem;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ───── ERROR ───── */

    .err-msg {
      display: none;
      align-items: center;
      gap: 8px;
      background: #fff5f5;
      border: 1px solid rgba(224,82,82,.2);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--red);
      font-size: .8rem;
      margin-top: 12px;
    }

    /* ───── BUTTON ───── */

    .btn-submit {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
      box-shadow: 0 8px 28px rgba(0,34,61,.25);
    }

    .btn-submit:hover {
      background: var(--blue2);
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0,34,61,.35);
    }

    /* ───── SUCCESS ───── */

    .success-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 52px 28px 48px;
      text-align: center;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg,#e9faf2,#d1f5e4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
    }

    .success-box h3 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.8rem;
      color: var(--navy);
    }

    .success-box p {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.7;
      max-width: 300px;
    }

    .rating-pill {
      padding: 8px 20px;
      border-radius: 50px;
      font-size: .82rem;
      font-weight: 700;
    }

    .pill-kurang {
      background: #ffe5e5;
      color: #c0392b;
    }

    .pill-baik {
      background: #fff8e1;
      color: #b8770a;
    }

    .pill-sangat {
      background: #e9faf2;
      color: #1e8449;
    }

    .btn-ulang {
      margin-top: 8px;
      padding: 12px 32px;
      border: 1.5px solid rgba(0,34,61,.15);
      background: transparent;
      color: var(--blue);
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .btn-ulang:hover {
      background: var(--blue);
      color: white;
    }

    /* ───── RESPONSIVE ───── */

    @media (max-width: 680px) {

      .page-wrap {
        grid-template-columns: 1fr;
        width: 100%;
        margin: 0;
        gap: 0;
      }

      .left-panel {
        position: static;
        background: var(--blue);
        padding: 36px 24px 28px;
        align-items: center;
        text-align: center;
      }

      .info-card {
        display: none;
      }

      .brand-block {
        align-items: center;
      }

      .brand-block h1 {
        color: white;
      }

      .brand-block h1 em {
        color: rgba(255,255,255,.7);
      }

      .brand-block .inst {
        color: rgba(255,255,255,.6);
      }

      .chip {
        background: rgba(255,255,255,.15);
        border-color: rgba(255,255,255,.2);
        color: white;
      }

      .soc-btn {
        background: rgba(255,255,255,.12);
        color: white;
      }

      .card {
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .card-body {
        padding: 22px 20px 28px;
      }

      .emoji-btn .icon {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="page-wrap">

  <!-- LEFT PANEL -->
  <div class="left-panel">

    <div class="brand-block">

      <div class="logo-wrap">
        <img src="LOGO PAS 2025 FIX.png" alt="Logo Lapas">
      </div>

      <div>
        <div class="chip">KEMENIMIPAS RI</div>

        <h1 style="margin-top:12px">
          Lapas<br>
          <em>Kelas III Lirung</em>
        </h1>

        <p class="inst" style="margin-top:8px">
          Lembaga Pemasyarakatan · Sulawesi Utara
        </p>
      </div>

    </div>

    <div class="info-card">

      <div class="info-card-title">
        Informasi Instansi
      </div>

      <div class="info-item">
        <div class="info-icon">📍</div>
        <div>
          <div class="info-text">Kab. Kepulauan Talaud</div>
          <div class="info-sub">Sulawesi Utara</div>
        </div>
      </div>

      <div class="info-item">
        <div class="info-icon">🏛️</div>
        <div>
          <div class="info-text">Lembaga Pemasyarakatan</div>
          <div class="info-sub">Kelas III</div>
        </div>
      </div>

    </div>

  </div>

  <!-- CARD -->
  <div class="card">

    <div class="card-header">

      <div class="card-header-dots"></div>

      <div class="step-row">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <h2>Survey Kepuasan Pelayanan</h2>

      <p>
        Pendapat Anda sangat berarti bagi kami
      </p>

    </div>

    <div class="card-body">

      <div class="field">
        <label>Nama Lengkap <span class="req">*</span></label>

        <div class="input-wrap">
          <input type="text" placeholder="Masukkan nama lengkap Anda">
        </div>
      </div>

      <div class="field">
        <label>Alamat <span class="req">*</span></label>

        <div class="input-wrap">
          <input type="text" placeholder="Kelurahan / Kecamatan / Kabupaten">
        </div>
      </div>

      <div class="field">
        <label>No. HP / WhatsApp <span class="req">*</span></label>

        <div class="input-wrap">
          <input type="tel" placeholder="08xxxxxxxxxx">
        </div>
      </div>

      <!-- RATING -->

      <div class="field">

        <div class="rating-label">
          Penilaian Kepuasan
        </div>

        <div class="emoji-row">

          <button class="emoji-btn">
            <span class="icon">😞</span>
            <span class="caption">Kurang</span>
            <span class="caption-sub">Perlu perbaikan</span>
          </button>

          <button class="emoji-btn">
            <span class="icon">😊</span>
            <span class="caption">Baik</span>
            <span class="caption-sub">Cukup memuaskan</span>
          </button>

          <button class="emoji-btn">
            <span class="icon">😄</span>
            <span class="caption">Sangat Baik</span>
            <span class="caption-sub">Sangat memuaskan</span>
          </button>

        </div>
      </div>

      <!-- TEXTAREA -->

      <div class="field">

        <label>
          Kritik & Saran
          <span class="opt">Opsional</span>
        </label>

        <div class="textarea-wrap">
          <textarea placeholder="Tuliskan kritik dan saran Anda..."></textarea>
        </div>

      </div>

      <button class="btn-submit">
        Kirim Survey →
      </button>

    </div>

  </div>

</div>

<footer>
  © 2025 Lapas Kelas III Lirung
</footer>

</body>
</html>
